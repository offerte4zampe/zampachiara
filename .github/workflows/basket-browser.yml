name: Basket browser smoke
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'site/assets/price-history.js'
      - 'site/assets/newsletter-readiness.js'
      - 'site/assets/newsletter.js'
      - 'site/newsletter.html'
      - 'site/data/newsletter.json'
      - 'worker/notification-plan.mjs'
      - 'worker/schema/**'
      - 'tests/test_notification*'
      - 'site/assets/search-suggest.js'
      - 'tests/test_search_suggest.mjs'
      - 'site/assets/home.js'
      - 'site/index.html'
      - 'tests/test_price_history.mjs'
      - 'site/assets/daily-cost.js'
      - 'tests/test_daily_cost.mjs'
      - 'site/assets/basket.js'
      - 'site/assets/catalog.js'
      - 'site/assets/trade.js'
      - 'site/assets/product-model.js'
      - 'site/assets/product.js'
      - 'site/assets/amazon-links.js'
      - 'site/data/amazon-links.json'
      - 'tests/test_amazon_links.mjs'
      - 'site/prodotto.html'
      - 'tests/test_product_view.mjs'
      - 'tests/test_home_data.py'
      - 'tests/test_search_index.py'
      - 'tests/check_search_suggest_browser.mjs'
      - 'site/assets/style.css'
      - 'site/confronta-cibo.html'
      - 'site/data/shipping-rules.json'
      - 'tests/test_basket.mjs'
      - 'site/carrello-risparmio.html'
      - 'tests/check_basket_browser.mjs'
      - 'tests/check_guides_browser.mjs'
      - 'automation/build_savings_guides.py'
      - 'automation/build_observatory.py'
      - 'automation/audit_site.py'
      - 'automation/apply_navigation.py'
      - 'automation/route_product_links.py'
      - 'tests/test_product_routing.py'
      - 'automation/remove_unverified_ads.py'
      - 'tests/test_ad_loader.py'
      - 'automation/build_catalog_preview.py'
      - 'tests/test_catalog_preview.py'
      - 'tests/test_navigation.py'
      - 'tests/test_static_site_audit.py'
      - 'tests/test_observatory.py'
      - '.github/workflows/basket-browser.yml'
permissions:
  contents: read
jobs:
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test basket and pricing invariants
        run: node --test tests/test_basket.mjs tests/test_trade.mjs tests/test_report.mjs tests/test_metrics.mjs tests/test_daily_cost.mjs tests/test_price_history.mjs tests/test_notification_plan.mjs tests/test_search_suggest.mjs tests/test_product_view.mjs tests/test_amazon_links.mjs
      - name: Test schema and generators without external services
        run: python -m unittest discover -s tests
      - name: Generate compact search index locally
        run: python automation/build_home_data.py
      - name: Generate catalog preview locally
        run: python automation/build_catalog_preview.py
      - name: Generate local observed history shards
        run: python automation/update_history.py
      - name: Generate current catalog guides locally
        run: python automation/build_savings_guides.py
      - name: Generate monthly observatory locally
        run: python automation/build_observatory.py
      - name: Normalize primary navigation
        run: python automation/apply_navigation.py
      - name: Route product links through comparison
        run: python automation/route_product_links.py
      - name: Remove unverified automatic ad loader
        run: python automation/remove_unverified_ads.py
      - name: Audit generated static pages
        run: python automation/audit_site.py
      - name: Install pinned browser driver
        run: npm install --prefix "$RUNNER_TEMP/basket-browser" puppeteer-core@25.14.0
      - name: Test isolated mobile basket
        run: |
          export CHROME_PATH="$(command -v google-chrome)"
          export PUPPETEER_ROOT="$RUNNER_TEMP/basket-browser"
          node tests/check_basket_browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: basket-mobile-smoke
          path: browser-reports/
          if-no-files-found: warn
          retention-days: 14
