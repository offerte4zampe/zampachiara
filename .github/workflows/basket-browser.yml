name: Basket browser smoke
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'site/assets/price-history.js'
      - 'site/assets/home.js'
      - 'site/index.html'
      - 'tests/test_price_history.mjs'
      - 'site/assets/daily-cost.js'
      - 'tests/test_daily_cost.mjs'
      - 'site/assets/basket.js'
      - 'site/assets/catalog.js'
      - 'site/assets/trade.js'
      - 'site/assets/style.css'
      - 'site/confronta-cibo.html'
      - 'site/data/shipping-rules.json'
      - 'tests/test_basket.mjs'
      - 'site/carrello-risparmio.html'
      - 'tests/check_basket_browser.mjs'
      - '.github/workflows/basket-browser.yml'
permissions:
  contents: read
jobs:
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test basket and pricing invariants
        run: node --test tests/test_basket.mjs tests/test_trade.mjs tests/test_report.mjs tests/test_metrics.mjs tests/test_daily_cost.mjs tests/test_price_history.mjs
      - name: Generate local observed history shards
        run: python automation/update_history.py
      - name: Install pinned browser driver
        run: npm install --prefix "$RUNNER_TEMP/basket-browser" puppeteer-core@25.14.0
      - name: Test isolated mobile basket
        run: |
          export CHROME_PATH="$(command -v google-chrome)"
          export PUPPETEER_ROOT="$RUNNER_TEMP/basket-browser"
          node tests/check_basket_browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: basket-mobile-smoke
          path: browser-reports/
          if-no-files-found: warn
          retention-days: 14
