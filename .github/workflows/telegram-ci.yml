name: Telegram publisher regression tests
on:
  push:
    branches: [main]
    paths:
      - 'worker/telegram.mjs'
      - 'worker/index.mjs'
      - 'tests/test_telegram.mjs'
      - '.github/workflows/telegram-ci.yml'
  pull_request:
    paths:
      - 'worker/telegram.mjs'
      - 'worker/index.mjs'
      - 'tests/test_telegram.mjs'
      - '.github/workflows/telegram-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  telegram:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check worker/telegram.mjs
      - run: node --test tests/test_telegram.mjs
