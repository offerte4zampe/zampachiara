name: Refresh real merchant catalogs
on:
  schedule:
    - cron: '12 */6 * * *'
  push:
    branches: [main]
    paths:
      - 'automation/update_catalog.py'
      - 'automation/enrich_catalog.py'
      - 'automation/update_history.py'
      - 'automation/build_category_pages.py'
      - 'automation/build_product_pages.py'
      - '.github/workflows/catalog.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: catalog-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests
      - run: node --test tests/test_metrics.mjs tests/test_trade.mjs
      - run: python automation/update_catalog.py
      - run: python automation/enrich_catalog.py
      - run: python automation/update_history.py
      - run: python automation/build_category_pages.py
      - run: python automation/build_product_pages.py
      - name: Publish refreshed catalog
        run: |
          if ! git diff --quiet -- site/data/catalog.json.gz site/data/price-history.json.gz site/data/catalog-quality.json automation/identifier-cache.json site/*.html site/sitemap.xml; then
            git config user.name "Offerte4Zampe catalog bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add site/data/catalog.json.gz site/data/price-history.json.gz site/data/catalog-quality.json automation/identifier-cache.json site/*.html site/sitemap.xml
            git commit -m "chore: refresh real merchant prices"
            git pull --rebase origin main
            git push
          fi
