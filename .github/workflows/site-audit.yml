name: Site quality audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/site-audit.yml']
permissions:
  contents: read
jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Lighthouse
        run: npm install --prefix "$RUNNER_TEMP/site-audit" lighthouse@13.5.0
      - name: Record public reachability separately
        run: |
          mkdir -p reports
          code=$(curl --max-time 20 --silent --output /dev/null --write-out '%{http_code}' https://offerte4zampe.it/osservatorio-prezzi) || code=000
          printf '{"url":"https://offerte4zampe.it/osservatorio-prezzi","http_status":"%s","scope":"public-reachability-only"}\n' "$code" > reports/public-reachability.json
          if [ "$code" != "200" ]; then
            echo "::warning::Public probe returned HTTP $code. Local Lighthouse does not verify Cloudflare or production performance."
          fi
      - name: Serve the checked-out static site
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory site > "$RUNNER_TEMP/site-audit-server.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/site-audit-server.pid"
          for attempt in $(seq 1 10); do
            if curl --fail --silent --output /dev/null http://127.0.0.1:8765/index.html; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Audit five checked-out pages on mobile (not production)
        run: |
          mkdir -p reports
          export CHROME_PATH="$(command -v google-chrome)"
          for iteration in 1 2 3; do
          for slug in home confronta-cibo costo-crocchette-cane osservatorio-prezzi linea-monge-bwild; do
            url="http://127.0.0.1:8765/$slug.html"
            if [ "$slug" = "home" ]; then url="http://127.0.0.1:8765/index.html"; fi
            node "$RUNNER_TEMP/site-audit/node_modules/lighthouse/cli/index.js" "$url" --chrome-flags="--headless --disable-dev-shm-usage" --only-categories=performance,accessibility,best-practices,seo --output=json --output=html --output-path="reports/$slug-$iteration" --quiet
          done
          done
      - name: Summarize median scores and enforce accessibility and SEO
        run: |
          node <<'NODE'
          const fs=require('fs'),path=require('path');
          const files=fs.readdirSync('reports').filter(f=>f.endsWith('.report.json'));
          if(files.length!==15)throw Error('Expected exactly 15 Lighthouse reports');
          const groups={},measurements={},findings={};
          const metricIds=['first-contentful-paint','largest-contentful-paint','total-blocking-time','cumulative-layout-shift','speed-index'];
          for(const file of files){
            const slug=file.replace(/-\d+\.report\.json$/,'');
            const report=JSON.parse(fs.readFileSync(path.join('reports',file)));
            if(report.runtimeError)throw Error(JSON.stringify(report.runtimeError));
            if(!report.finalDisplayedUrl?.startsWith('http://127.0.0.1:8765/'))throw Error('Unexpected audit destination');
            const scores=Object.fromEntries(['performance','accessibility','best-practices','seo'].map(k=>[k,report.categories[k].score]));
            if(Object.values(scores).some(v=>typeof v!=='number'||!Number.isFinite(v)))throw Error('Missing score');
            (groups[slug]??=[]).push(scores);
            const metrics=Object.fromEntries(metricIds.map(id=>[id,report.audits[id]?.numericValue]));
            if(Object.values(metrics).some(v=>typeof v!=='number'||!Number.isFinite(v)))throw Error('Missing performance metric');
            (measurements[slug]??=[]).push(metrics);
            const failing=[...new Set(report.categories['best-practices'].auditRefs.map(ref=>ref.id))]
              .filter(id=>typeof report.audits[id]?.score==='number'&&report.audits[id].score<1)
              .map(id=>({id,title:report.audits[id].title,score:report.audits[id].score,displayValue:report.audits[id].displayValue||null}));
            (findings[slug]??=[]).push(failing);
          }
          const median=values=>values.sort((a,b)=>a-b)[Math.floor(values.length/2)];
          const summary=Object.fromEntries(Object.entries(groups).map(([slug,runs])=>[slug,Object.fromEntries(Object.keys(runs[0]).map(k=>[k,median(runs.map(r=>r[k]))]))]));
          const metrics=Object.fromEntries(Object.entries(measurements).map(([slug,runs])=>[slug,Object.fromEntries(metricIds.map(id=>[id,median(runs.map(r=>r[id]))]))]));
          const evidence={scope:'local-static-checkout-not-production',commit:process.env.GITHUB_SHA,lighthouse:'13.5.0',iterations:3,pages:summary,median_metrics:metrics,metric_units:{'first-contentful-paint':'ms','largest-contentful-paint':'ms','total-blocking-time':'ms','cumulative-layout-shift':'unitless','speed-index':'ms'},best_practices_findings:findings};
          fs.writeFileSync('reports/summary.json',JSON.stringify(evidence,null,2));
          console.log('AUDIT_EVIDENCE '+JSON.stringify(evidence));
          console.log(JSON.stringify(summary));
          if(Object.values(summary).some(s=>s.accessibility<.95||s.seo<.95))process.exit(1);
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: local-site-mobile-audit
          path: reports/
          if-no-files-found: error
          retention-days: 14
