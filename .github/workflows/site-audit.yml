name: Public site audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/site-audit.yml']
permissions:
  contents: read
jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Lighthouse
        run: npm install --prefix "$RUNNER_TEMP/site-audit" lighthouse@13.5.0
      - name: Wait for the compact home deployment
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --output /dev/null https://offerte4zampe.it/osservatorio-prezzi; then exit 0; fi
            sleep 10
          done
          exit 1
      - name: Audit four public pages on mobile
        run: |
          mkdir -p reports
          export CHROME_PATH="$(command -v google-chrome)"
          for iteration in 1 2 3; do
          for slug in home confronta-cibo costo-crocchette-cane osservatorio-prezzi; do
            url="https://offerte4zampe.it/$slug"
            if [ "$slug" = "home" ]; then url="https://offerte4zampe.it/"; fi
            node "$RUNNER_TEMP/site-audit/node_modules/lighthouse/cli/index.js" "$url" --chrome-flags="--headless --disable-dev-shm-usage" --only-categories=performance,accessibility,best-practices,seo --output=json --output=html --output-path="reports/$slug-$iteration" --quiet
          done
          done
      - name: Summarize median scores and enforce accessibility and SEO
        run: |
          node <<'NODE'
          const fs=require('fs'),path=require('path');
          const files=fs.readdirSync('reports').filter(f=>f.endsWith('.report.json'));
          const groups={};
          for(const file of files){
            const slug=file.replace(/-\d+\.report\.json$/,'');
            const report=JSON.parse(fs.readFileSync(path.join('reports',file)));
            const scores=Object.fromEntries(['performance','accessibility','best-practices','seo'].map(k=>[k,report.categories[k].score]));
            (groups[slug]??=[]).push(scores);
          }
          const median=values=>values.sort((a,b)=>a-b)[Math.floor(values.length/2)];
          const summary=Object.fromEntries(Object.entries(groups).map(([slug,runs])=>[slug,Object.fromEntries(Object.keys(runs[0]).map(k=>[k,median(runs.map(r=>r[k]))]))]));
          fs.writeFileSync('reports/summary.json',JSON.stringify({iterations:3,pages:summary},null,2));
          console.log(JSON.stringify(summary));
          if(Object.values(summary).some(s=>s.accessibility<.95||s.seo<.95))process.exit(1);
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-site-mobile-audit
          path: reports/
          if-no-files-found: error
          retention-days: 14
