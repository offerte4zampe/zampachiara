name: Telegram photo safety regression
on:
  push:
    branches: [main]
    paths:
      - 'worker/telegram.mjs'
      - 'tests/test_telegram.mjs'
      - '.github/workflows/telegram-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare denied-by-default build attestation
        run: python automation/check_d1_activation.py --prepare-build
      - name: Telegram regression tests
        run: node --test tests/test_telegram.mjs
